name: Release

# A tag is the release. CLAUDE.md's version policy names the tags v0.<major>.<ui>-beta, so a tag
# push is the one event that builds a distributable: the Phase 6 publish is a `dotnet publish`
# nobody has to type by hand, and the tag is checked against Directory.Build.props before anything
# is uploaded, because a download whose tag, title and file properties disagree is worse than no
# release at all. Ordinary pushes never run this; a tag's push also starts ci.yml, but the two jobs
# run side by side and neither waits for the other, so this one builds and runs the suite itself: a red
# suite must not ship a release that the next run would call broken.
on:
  push:
    tags:
      - 'v*'

# The job creates the release and uploads its asset. Reading the repository is not enough.
permissions:
  contents: write

jobs:
  publish:
    # The Controller is a WPF project on net8.0-windows, so the publish needs a Windows runner.
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Before the build, so a mistyped tag costs a minute rather than a publish.
      - name: Check the tag against VersionPrefix
        shell: pwsh
        run: ./tools/check-release-tag.ps1 -Tag '${{ github.ref_name }}'

      - name: Restore
        run: dotnet restore PoolScoreboard.sln

      # The same two commands ci.yml runs, in the same order, for the same reason: the release is the one
      # build nobody looks at again, and ci.yml starting on the same tag push is not an ordering.
      - name: Build
        run: dotnet build PoolScoreboard.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PoolScoreboard.sln --configuration Release --no-build --logger "console;verbosity=normal"

      # The documented Phase 6 command. PublishSingleFile and its two companions are switched on by
      # the Controller's csproj when SelfContained is true, so no extra -p: flags belong here.
      - name: Publish the single-file win-x64 build
        run: >
          dotnet publish PoolScoreboard.Controller/PoolScoreboard.Controller.csproj
          --configuration Release --runtime win-x64 --self-contained true
          --output publish

      - name: Pack the download
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          $exe = 'publish/PoolScoreboard.Controller.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "$exe was not produced — the publish did not make a single file."
          }
          # A single-file publish leaves no assemblies behind; one means the switch was lost and
          # the download would need more than the exe.
          $stray = @(Get-ChildItem -LiteralPath publish -Filter *.dll)
          if ($stray.Count -gt 0) {
            throw "The publish left $($stray.Count) assembly file(s) beside the exe, so it is not a single-file build."
          }
          $zip = "PoolScoreboard-$version-win-x64.zip"
          Compress-Archive -LiteralPath $exe -DestinationPath $zip -Force
          "VERSION=$version" >> $env:GITHUB_ENV
          "ASSET=$zip" >> $env:GITHUB_ENV

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          # A re-run of a failed release lands on the same release rather than a second one.
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:ASSET --clobber
          } else {
            $notes = "PoolScoreboard $env:VERSION for Windows x64 — one self-contained executable, no .NET runtime to install. Unzip it and run PoolScoreboard.Controller.exe."
            gh release create $tag $env:ASSET --title "PoolScoreboard $env:VERSION" --notes $notes
          }
