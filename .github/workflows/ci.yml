name: CI

# Every push, on any branch, plus a manual run from the Actions tab.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # The Controller targets net8.0-windows with WPF, so the whole-solution build needs a
    # Windows runner — ubuntu-latest cannot build the WPF project.
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # tools/verify-live.ps1 drives the real window and real sockets, so CI can never run it. Parsing it is
      # cheap and is what stops a typo in a scenario only used by hand from waiting for the next manual run.
      - name: Parse the live-check script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path 'tools/verify-live.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            foreach ($problem in $errors) {
              Write-Host "::error file=tools/verify-live.ps1,line=$($problem.Extent.StartLineNumber)::$($problem.Message)"
            }
            exit 1
          }
          Write-Host 'tools/verify-live.ps1 parses.'

      # Keyed on the project files (and the shared version props) so a dependency or version
      # change invalidates the cache rather than reusing stale packages.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore PoolScoreboard.sln

      - name: Build
        run: dotnet build PoolScoreboard.sln --configuration Release --no-restore

      # Runs every test project in the solution: Core logic, plus the Controller's file-backed
      # persistence store (which is why the whole job needs a Windows runner).
      - name: Test
        run: dotnet test PoolScoreboard.sln --configuration Release --no-build --logger "console;verbosity=normal"
